<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>GeoRush — City Pinpointing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f2e5cb;
    --bg-2: #ebd9b6;
    --surface: #faf2dd;
    --ink: #2a1d12;
    --ink-2: #5a4630;
    --ink-soft: #8a7355;
    --line: #5a4630;
    --line-soft: #c2a978;
    --accent: #b04a32;
    --gold: #d49a17;
    --moss: #6a8c44;
    --rust: #b04a32;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body {
    margin: 0; padding: 0;
    font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(ellipse at top left, #f4e7cc 0%, transparent 60%),
      radial-gradient(ellipse at bottom right, #ecd9b0 0%, transparent 55%),
      var(--bg);
    min-height: 100vh;
    -webkit-text-size-adjust: 100%;
  }
  .gr-root { max-width: 640px; margin: 0 auto; padding: 18px 16px 28px; }

  /* Header */
  .gr-header {
    display: flex; justify-content: space-between; align-items: flex-end;
    gap: 12px; padding-bottom: 14px; border-bottom: 1.5px solid var(--line); margin-bottom: 12px;
  }
  .gr-title {
    font-family: 'Fraunces', Georgia, serif; font-weight: 900;
    font-size: clamp(26px, 7vw, 38px); line-height: 1; letter-spacing: -0.02em;
    font-variation-settings: "opsz" 144; margin: 0;
  }
  .gr-subtitle {
    font-family: 'Fraunces', Georgia, serif; font-style: italic; font-weight: 500;
    color: var(--ink-soft); font-size: 12px; margin-top: 5px;
  }
  .gr-header-actions { display: flex; gap: 8px; align-items: center; }
  .gr-select {
    font-family: 'Manrope', sans-serif; font-weight: 600; font-size: 13px;
    color: var(--ink); background: var(--surface); border: 1.5px solid var(--line);
    padding: 8px 10px; border-radius: 0; cursor: pointer; -webkit-appearance: none; appearance: none;
  }
  .gr-icon-btn {
    font-size: 18px; line-height: 1; background: var(--surface); border: 1.5px solid var(--line);
    padding: 7px 10px; cursor: pointer; color: var(--ink);
  }
  .gr-icon-btn:active { background: var(--bg-2); }

  /* Stats bar */
  .gr-statsbar {
    display: flex; align-items: center; gap: 9px; flex-wrap: wrap;
    font-size: 13px; font-weight: 600; color: var(--ink-2);
    font-variant-numeric: tabular-nums; margin-bottom: 12px;
  }
  .gr-dot { color: var(--line-soft); }
  .gr-badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-weight: 700; padding: 2px 8px; border: 1.4px solid var(--line); background: var(--surface);
  }

  /* Map */
  .gr-map-card {
    background: var(--surface); border: 1.5px solid var(--line);
    position: relative; aspect-ratio: 1.7 / 1; min-height: 300px; overflow: hidden;
    margin-bottom: 12px;
  }
  .gr-map { width: 100%; height: 100%; touch-action: none; -webkit-user-select: none; user-select: none; }
  .gr-map-hint {
    position: absolute; bottom: 10px; left: 0; right: 0; text-align: center;
    font-size: 12px; font-weight: 600; color: var(--ink-2); pointer-events: none;
    text-shadow: 0 1px 2px rgba(250,242,221,0.95), 0 0 6px rgba(250,242,221,0.9);
    transition: opacity 0.3s;
  }
  .gr-map-status {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-family: 'Fraunces', serif; font-weight: 700; font-size: 16px; color: var(--ink-2);
    background: var(--surface); text-align: center; padding: 16px;
  }

  /* Prompt / result card */
  .gr-card {
    background: var(--surface); border: 1.5px solid var(--line); padding: 16px 18px;
  }
  .gr-prompt { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 16px; }
  .gr-find { font-size: 13px; font-weight: 700; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.08em; }
  .gr-city {
    font-family: 'Fraunces', Georgia, serif; font-weight: 900; font-size: clamp(22px, 6vw, 30px);
    letter-spacing: 0.01em; color: var(--ink); text-transform: uppercase;
  }
  .gr-flag { font-size: 24px; line-height: 1; }
  .gr-country { font-size: 14px; color: var(--ink-soft); font-weight: 600; }

  .gr-result-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .gr-result-emoji { font-size: 26px; }
  .gr-result-dist {
    font-family: 'Fraunces', Georgia, serif; font-weight: 900; font-size: clamp(22px, 6vw, 30px); color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .gr-result-verdict { font-family: 'Fraunces', serif; font-style: italic; font-weight: 500; color: var(--ink-soft); font-size: 15px; }
  .gr-result-score { font-size: 14px; font-weight: 700; color: var(--ink-2); margin-top: 6px; font-variant-numeric: tabular-nums; }

  .gr-btn {
    margin-top: 12px; width: 100%; font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 15px;
    color: var(--surface); background: var(--accent); border: 1.5px solid var(--line);
    padding: 13px 18px; cursor: pointer; letter-spacing: 0.03em;
  }
  .gr-btn:active { background: #97402c; }
  .gr-btn.secondary { color: var(--ink); background: var(--surface); }
  .gr-btn.secondary:active { background: var(--bg-2); }

  /* Toast */
  .gr-toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    background: var(--ink); color: var(--surface); font-weight: 700; font-size: 14px;
    padding: 11px 18px; border: 1.5px solid var(--line); z-index: 60;
    box-shadow: 0 6px 20px rgba(42,29,18,0.3); white-space: nowrap;
  }

  /* Overlay / modal */
  .gr-overlay {
    position: fixed; inset: 0; background: rgba(42,29,18,0.55); z-index: 50;
    display: flex; align-items: center; justify-content: center; padding: 18px;
  }
  .gr-modal {
    background: var(--surface); border: 1.5px solid var(--line); padding: 22px 20px;
    max-width: 460px; width: 100%; max-height: 88vh; overflow-y: auto;
    box-shadow: 0 10px 40px rgba(42,29,18,0.4);
  }
  .gr-modal h2 {
    font-family: 'Fraunces', serif; font-weight: 900; font-size: 22px; margin: 0 0 4px;
  }
  .gr-modal p.sub { color: var(--ink-soft); font-size: 13px; margin: 0 0 16px; }
  .gr-field { margin-bottom: 14px; }
  .gr-field label { display: block; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-soft); margin-bottom: 5px; }
  .gr-input, .gr-modal select {
    width: 100%; font-family: 'Manrope', sans-serif; font-size: 15px; color: var(--ink);
    background: var(--bg); border: 1.5px solid var(--line); padding: 11px 12px; -webkit-appearance: none; appearance: none;
  }
  .gr-rounds { display: flex; gap: 8px; }
  .gr-round-opt {
    flex: 1; font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 15px; cursor: pointer;
    background: var(--bg); border: 1.5px solid var(--line); padding: 11px 0; text-align: center; color: var(--ink);
  }
  .gr-round-opt.active { background: var(--accent); color: var(--surface); }

  .gr-summary-row { display: flex; align-items: center; gap: 8px; font-size: 15px; margin: 7px 0; }
  .gr-summary-row b { font-family: 'Fraunces', serif; }
  .gr-divider { border: none; border-top: 1.5px solid var(--line-soft); margin: 14px 0; }

  .gr-lb { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  .gr-lb td { padding: 8px 4px; border-bottom: 1px solid var(--line-soft); font-size: 14px; }
  .gr-lb td.rank { width: 30px; font-size: 18px; }
  .gr-lb td.name { font-weight: 700; }
  .gr-lb td.num { text-align: right; color: var(--ink-2); }
  .gr-lb tr.me td { background: rgba(212,154,23,0.18); }

  .gr-link-box {
    display: flex; gap: 8px; align-items: center; background: var(--bg); border: 1.5px solid var(--line); padding: 10px 12px; margin: 6px 0 12px;
  }
  .gr-link-box code { font-size: 13px; word-break: break-all; flex: 1; }
  .gr-err { color: var(--wrong, #8b1a1a); font-weight: 700; font-size: 14px; margin: 8px 0; }
  .gr-muted { color: var(--ink-soft); font-size: 13px; }
</style>
</head>
<body>
<div class="gr-root">
  <header class="gr-header">
    <div>
      <h1 class="gr-title">🌍 GeoRush</h1>
      <div class="gr-subtitle">city pinpointing practice</div>
    </div>
    <div class="gr-header-actions">
      <select id="regionFilter" class="gr-select" aria-label="Region filter">
        <option value="All">All regions</option>
        <option value="Africa">Africa</option>
        <option value="Europe">Europe</option>
        <option value="Americas">Americas</option>
        <option value="Asia">Asia</option>
        <option value="Oceania">Oceania</option>
      </select>
      <button id="settingsBtn" class="gr-icon-btn" aria-label="Settings">⚙️</button>
    </div>
  </header>

  <div class="gr-statsbar" id="statsBar">
    <span id="roundLabel">Round 1</span>
    <span class="gr-dot">•</span>
    <span id="diffBadge" class="gr-badge">🟢 Easy</span>
    <span class="gr-dot">•</span>
    <span id="avgLabel">Avg: — km</span>
  </div>

  <div class="gr-map-card">
    <div id="map" class="gr-map"></div>
    <div id="mapHint" class="gr-map-hint">tap anywhere to place your guess</div>
    <div id="mapStatus" class="gr-map-status">Loading map…</div>
  </div>

  <div class="gr-card">
    <div id="promptView" class="gr-prompt">
      <span class="gr-find">🔍 Find:</span>
      <span id="promptCity" class="gr-city">—</span>
      <span id="promptFlag" class="gr-flag"></span>
      <span id="promptCountry" class="gr-country"></span>
    </div>
    <div id="resultView" hidden>
      <div class="gr-result-head">
        <span id="resultEmoji" class="gr-result-emoji"></span>
        <span id="resultDist" class="gr-result-dist"></span>
        <span id="resultVerdict" class="gr-result-verdict"></span>
      </div>
      <div id="resultScore" class="gr-result-score"></div>
      <button id="nextBtn" class="gr-btn">NEXT CITY →</button>
    </div>
  </div>
</div>

<div id="toast" class="gr-toast" hidden></div>
<div id="overlay" class="gr-overlay" hidden><div class="gr-modal" id="modalBody"></div></div>

<script>

const SB_URL = 'SUPABASE_URL_HERE';
const SB_KEY = 'SUPABASE_ANON_KEY_HERE';

async function sbGet(path) {
  try {
    const r = await fetch(`${SB_URL}/rest/v1/${path}`, {
      headers: { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}` }
    });
    return r.ok ? r.json() : null;
  } catch { return null; }
}

async function sbPost(path, body) {
  try {
    const r = await fetch(`${SB_URL}/rest/v1/${path}`, {
      method: 'POST',
      headers: {
        apikey: SB_KEY,
        Authorization: `Bearer ${SB_KEY}`,
        'Content-Type': 'application/json',
        Prefer: 'return=representation'
      },
      body: JSON.stringify(body)
    });
    return r.ok ? r.json() : null;
  } catch { return null; }
}

// ── Scoring & distance (per spec) ───────────────────────────────────────────
const MAX_DIST_KM = 10000;
function calcScore(distanceKm) {
  return Math.round(1000 * Math.max(0, 1 - distanceKm / MAX_DIST_KM));

function haversineKm(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) ** 2 +
    Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
    Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.asin(Math.sqrt(a));
}

const DOT_R = 6;

// Coordinate conversion (per spec) — required for placing pins and scoring.
function svgToLatLon(svgX, svgY) {
  const [lon, lat] = _projection.invert([svgX, svgY]);
  return { lat, lon };
}
function latLonToSvg(lat, lon) {
  return _projection([lon, lat]); // [svgX, svgY]
}

function showMapStatus(msg) { const s = $('mapStatus'); if (s) { s.textContent = msg; s.style.display = 'flex'; } }
function hideMapStatus() { const s = $('mapStatus'); if (s) s.style.display = 'none'; }

function initMap(topology) {
  const mapEl = $('map');
  if (!mapEl.offsetWidth || !mapEl.offsetHeight) {
    requestAnimationFrame(() => initMap(topology));
    return;
  }
  _mDiv = mapEl;
  _mapW = mapEl.offsetWidth;
  _mapH = mapEl.offsetHeight;

  // Full world landmass as background (GeoRush lets you tap anywhere by lat/lon).
  const features = topojson.feature(topology, topology.objects.countries).features;

  const projection = d3.geoNaturalEarth1()
    .fitExtent([[8, 8], [_mapW - 8, _mapH - 8]],
      { type: 'FeatureCollection', features });
  const pathGen = d3.geoPath().projection(projection);
  _projection = projection;

  _svg = d3.select(mapEl).append('svg')
    .attr('viewBox', `0 0 ${_mapW} ${_mapH}`)
    .style('width', '100%').style('height', '100%')
    .style('display', 'block')
    .style('touch-action', 'none');

  _svg.append('rect').attr('width', _mapW).attr('height', _mapH).attr('fill', '#bcd0d4');
  _svg.append('defs').append('clipPath').attr('id', 'map-clip')
    .append('rect').attr('width', _mapW).attr('height', _mapH);
  _g = _svg.append('g').attr('clip-path', 'url(#map-clip)');

  _g.selectAll('path')
    .data(features).enter().append('path')
    .attr('d', pathGen)
    .attr('fill', '#cdb78a')
    .attr('stroke', 'none');

  // ── Hypsometric relief: reproject the inline equirectangular raster into the
  //    same Natural Earth projection so it aligns with the vector land, then clip
  //    to land so the ocean stays flat. Solid land fill above remains as a
  //    graceful fallback if the image fails to load. Fully self-contained.
  const landPathD = pathGen({ type: 'FeatureCollection', features });
  _svg.select('defs').append('clipPath').attr('id', 'land-clip')
    .append('path').attr('d', landPathD);
  const reliefImg = _g.append('image')
    .attr('x', 0).attr('y', 0).attr('width', _mapW).attr('height', _mapH)
    .attr('preserveAspectRatio', 'none')
    .attr('clip-path', 'url(#land-clip)')
    .style('pointer-events', 'none');
  renderRelief(reliefImg);

  // ── Dot markers for small island nations (adapted from world.html) ─────────
  // Drawn at each island centroid so they're visible at world scale, since the
  // game asks about Tuvalu, Maldives, Caribbean micro-states, etc.
  Object.entries(SMALL_COUNTRIES).forEach(([iso, {lat, lon}]) => {
    const pos = _projection([lon, lat]); if (!pos) return;
    const [cx, cy] = pos;
    _g.append('circle').attr('class', 'dot-country').attr('data-iso', iso)
      .attr('cx', cx).attr('cy', cy).attr('r', DOT_R)
      .attr('fill', '#cdb78a').attr('stroke', 'none')
      .style('pointer-events', 'none');
  });

  // ── Zoom holds transform STATE only — gestures handled via Touch/Mouse ─────
  _zoom = d3.zoom()
    .scaleExtent([1, 14])
    .on('zoom', event => {
      _g.attr('transform', event.transform);
      const k = event.transform.k;
      _g.selectAll('circle.dot-country').attr('r', (DOT_R / k).toFixed(2));
      _g.selectAll('circle.gr-mk').attr('r', (5.5 / k).toFixed(2)).attr('stroke-width', (1.6 / k).toFixed(3));
      _g.selectAll('line.gr-line').attr('stroke-width', (1.4 / k).toFixed(3));
      _g.selectAll('text.gr-lbl').style('font-size', (13 / k).toFixed(2) + 'px');
    });
  _svg.call(_zoom.transform, d3.zoomIdentity);

  function _getT() { return d3.zoomTransform(_svg.node()); }
  function _applyT(tx, ty, k) {
    _svg.call(_zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(k));
  }

  function clientToSvg(clientX, clientY) {
    const rect = _mDiv.getBoundingClientRect();
    return [(clientX - rect.left) * (_mapW / rect.width),
            (clientY - rect.top)  * (_mapH / rect.height)];
  }

  // ── Touch Events (iOS Safari safe). passive:false + preventDefault. ────────
  // While guessing: any tap = place guess pin (no panning).
  // After reveal: 1 finger pans, 2 fingers pinch-zoom to explore.
  let _pan = null, _pinch = null;
  _mDiv.addEventListener('touchstart', ev => {
    ev.preventDefault();
    if (gameState === 'guessing') {
      const t = ev.touches[0];
      const [sx, sy] = clientToSvg(t.clientX, t.clientY);
      placeGuess(sx, sy);
      return;
    }
    if (gameState !== 'revealed') return;
    const ct = _getT();
    if (ev.touches.length === 1) {
      const t = ev.touches[0];
      _pan = { sx: t.clientX, sy: t.clientY, tx: ct.x, ty: ct.y, k: ct.k };
      _pinch = null;
    } else if (ev.touches.length === 2) {
      const a = ev.touches[0], b = ev.touches[1];
      _pinch = {
        dist: Math.hypot(b.clientX - a.clientX, b.clientY - a.clientY),
        cx: (a.clientX + b.clientX) / 2, cy: (a.clientY + b.clientY) / 2,
        tx: ct.x, ty: ct.y, k: ct.k
      };
      _pan = null;
    }
  }, { passive: false });

  _mDiv.addEventListener('touchmove', ev => {
    if (gameState !== 'revealed') { ev.preventDefault(); return; }
    ev.preventDefault();
    if (ev.touches.length === 1 && _pan) {
      const t = ev.touches[0];
      _applyT(_pan.tx + (t.clientX - _pan.sx), _pan.ty + (t.clientY - _pan.sy), _pan.k);
    } else if (ev.touches.length >= 2 && _pinch) {
      const a = ev.touches[0], b = ev.touches[1];
      const dist = Math.hypot(b.clientX - a.clientX, b.clientY - a.clientY);
      const cx = (a.clientX + b.clientX) / 2, cy = (a.clientY + b.clientY) / 2;
      const newK = Math.max(1, Math.min(14, _pinch.k * (dist / _pinch.dist)));
      const r = newK / _pinch.k;
      _applyT(cx - (_pinch.cx - _pinch.tx) * r, cy - (_pinch.cy - _pinch.ty) * r, newK);
    }
  }, { passive: false });

  _mDiv.addEventListener('touchend', ev => {
    if (ev.touches.length === 0) { _pan = null; _pinch = null; }
    else if (ev.touches.length === 1 && _pinch) {
      const ct = _getT(), t = ev.touches[0];
      _pan = { sx: t.clientX, sy: t.clientY, tx: ct.x, ty: ct.y, k: ct.k };
      _pinch = null;
    }
  }, { passive: false });

  _mDiv.addEventListener('touchcancel', () => { _pan = null; _pinch = null; }, { passive: false });

  // ── Mouse (desktop): click = guess, drag = pan (revealed), wheel = zoom ────
  const svgNode = _svg.node();
  let _mPan = null, _mMoved = false;
  // A click places a guess — but only when it's a real click, not the click that
  // browsers fire at the end of a drag-to-pan gesture (_mMoved guards that).
  svgNode.addEventListener('click', e => {
    if (gameState !== 'guessing' || _mMoved) return;
    const [sx, sy] = clientToSvg(e.clientX, e.clientY);
    placeGuess(sx, sy);
  });

  // Drag pans in BOTH guessing and revealed so you can line up a precise guess
  // after zooming in. (Touch single-finger tap still = guess; see touch handlers.)
  _svg.on('mousedown.nav', ev => {
    if (ev.button || (gameState !== 'guessing' && gameState !== 'revealed')) return;
    const ct = _getT();
    _mPan = { sx: ev.clientX, sy: ev.clientY, tx: ct.x, ty: ct.y, k: ct.k };
    _mMoved = false;
  });
  _svg.on('mousemove.nav', ev => {
    if (!_mPan) return;
    const dx = ev.clientX - _mPan.sx, dy = ev.clientY - _mPan.sy;
    if (Math.hypot(dx, dy) > 4) _mMoved = true;
    _applyT(_mPan.tx + dx, _mPan.ty + dy, _mPan.k);
  });
  // Leave _mMoved set after mouseup so the click that fires next can distinguish
  // a drag from a click; it is reset on the next mousedown.
  _svg.on('mouseup.nav', () => { _mPan = null; });
  _svg.on('mouseleave.nav', () => { _mPan = null; });
  _svg.on('wheel.nav', ev => {
    if (gameState !== 'guessing' && gameState !== 'revealed') return;
    ev.preventDefault();
    const ct = _getT();
    const f = Math.pow(2, -ev.deltaY * (ev.deltaMode === 1 ? 0.05 : 0.002));
    const newK = Math.max(1, Math.min(14, ct.k * f));
    const r = newK / ct.k;
    const rc = svgNode.getBoundingClientRect();
    const px = ev.clientX - rc.left, py = ev.clientY - rc.top;
    _applyT(px - (px - ct.x) * r, py - (py - ct.y) * r, newK);
  }, { passive: false });

  hideMapStatus();
}

// Reproject the inline equirectangular relief into the active Natural Earth
// projection, pixel-by-pixel via projection.invert, and assign it to the SVG
// <image>. One-time cost at load. Errors leave the solid land fill in place.
function renderRelief(imgSel) {
  const img = new Image();
  img.onload = () => {
    try {
      const sw = img.naturalWidth, sh = img.naturalHeight;
      const sc = document.createElement('canvas'); sc.width = sw; sc.height = sh;
      const sctx = sc.getContext('2d'); sctx.drawImage(img, 0, 0);
      const src = sctx.getImageData(0, 0, sw, sh).data;

      const dw = Math.min(1600, Math.max(1, Math.round(_mapW * 2)));
      const dh = Math.max(1, Math.round(dw * (_mapH / _mapW)));
      const dc = document.createElement('canvas'); dc.width = dw; dc.height = dh;
      const dctx = dc.getContext('2d');
      const out = dctx.createImageData(dw, dh);
      const od = out.data;
      const kx = _mapW / dw, ky = _mapH / dh;

      for (let y = 0; y < dh; y++) {
        const svgY = (y + 0.5) * ky;
        for (let x = 0; x < dw; x++) {
          const di = (y * dw + x) * 4;
          const ll = _projection.invert([(x + 0.5) * kx, svgY]);
          if (!ll || !isFinite(ll[0]) || !isFinite(ll[1]) ||
              ll[0] < -180 || ll[0] > 180 || ll[1] < -90 || ll[1] > 90) {
            od[di + 3] = 0; continue;
          }
          let u = ((ll[0] + 180) / 360 * sw) | 0;
          let v = ((90 - ll[1]) / 180 * sh) | 0;
          if (u < 0) u = 0; else if (u >= sw) u = sw - 1;
          if (v < 0) v = 0; else if (v >= sh) v = sh - 1;
          const si = (v * sw + u) * 4;
          od[di] = src[si]; od[di + 1] = src[si + 1]; od[di + 2] = src[si + 2]; od[di + 3] = 255;
        }
      }
      dctx.putImageData(out, 0, 0);
      const href = dc.toDataURL('image/jpeg', 0.85);
      imgSel.attr('href', href).attr('xlink:href', href);
    } catch (e) { /* fallback: solid land fill remains */ }
  };
  img.onerror = () => { /* fallback: solid land fill remains */ };
  img.src = RELIEF_URI;
}

// Session accumulators (reset per page load / per challenge)

let sessionScoreTotal = 0;

// Challenge state
let challenge = null;       // { id, cities, region, rounds, created_by }
let challengePlayer = '';
let challengeRounds = [];   // { city, km, score }

const STORAGE_KEY = 'georush_stats';
const PLAY_URL = 'https://brondumjacob.github.io/geography-quiz/georush.html';

const DIFF_META = {
  easy:   { badge: '🟢 Easy',   label: 'Easy' },
  medium: { badge: '🟡 Medium', label: 'Medium' },
  hard:   { badge: '🔴 Hard',   label: 'Hard' },
};

// ── localStorage stats ───────────────────────────────────────────────────────
function loadStats() {
  try {
    const raw = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (raw && typeof raw === 'object') {
      return {
        totalRounds: raw.totalRounds || 0,
        totalScore: raw.totalScore || 0,
        totalDistanceKm: raw.totalDistanceKm || 0,
        bestGuessKm: (raw.bestGuessKm == null) ? Infinity : raw.bestGuessKm,
        bestGuessCity: raw.bestGuessCity || '',
        bestSessionAvgKm: (raw.bestSessionAvgKm == null) ? Infinity : raw.bestSessionAvgKm,
        history: Array.isArray(raw.history) ? raw.history : [],
      };
    }
  } catch {}
  return { totalRounds: 0, totalScore: 0, totalDistanceKm: 0, bestGuessKm: Infinity,
           bestGuessCity: '', bestSessionAvgKm: Infinity, history: [] };
}
function saveStats(s) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); } catch {}
}

// ── Toast ────────────────────────────────────────────────────────────────────
let _toastTimer = null;
function showToast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => { t.hidden = true; }, 2000);

// ── Difficulty auto-scaling (Solo only) ─────────────────────────────────────
function evaluateDifficulty() {
  if (mode !== 'solo') return;
  if (recentKm.length < 5) return;
  const window5 = recentKm.slice(-5);
  const avg = window5.reduce((a, b) => a + b, 0) / window5.length;
  const prev = difficulty;
  if (difficulty === 'easy' && avg < 400) difficulty = 'medium';
  else if (difficulty === 'medium' && avg < 600) difficulty = 'hard';
  else if (difficulty === 'medium' && avg > 2500) difficulty = 'easy';
  else if (difficulty === 'hard' && avg > 2000) difficulty = 'medium';
  if (difficulty !== prev) {
    const up = (prev === 'easy') || (prev === 'medium' && difficulty === 'hard');
    showToast(`${up ? '📈' : '📉'} Difficulty → ${DIFF_META[difficulty].label} ${DIFF_META[difficulty].badge.slice(0, 2)}`);
  }
}

// ── Stats bar ────────────────────────────────────────────────────────────────
function updateStatsBar() {
  $('roundLabel').textContent = mode === 'challenge'
    ? `Round ${round} / ${challenge ? challenge.rounds : '—'}`
    : `Round ${Math.max(1, round)}`;
  const badge = $('diffBadge');
  if (mode === 'challenge') {
    badge.textContent = '🏆 Challenge';
  } else {
    badge.textContent = DIFF_META[difficulty].badge;
  }
  const avg = round > 0 ? Math.round(sessionDistTotal / round) : null;
  $('avgLabel').textContent = avg == null ? 'Avg: — km' : `Avg: ${fmtKm(avg)} km`;
}

// ── Prompt / result views ────────────────────────────────────────────────────
function showHint() { $('mapHint').style.opacity = '1'; }
function hideHint() { $('mapHint').style.opacity = '0'; }

function renderPrompt() {

function showResult(km, score) {
  const v = verdict(km);
  $('promptView').hidden = true;
  $('resultView').hidden = false;
  $('resultEmoji').textContent = v.emoji;
  $('resultDist').textContent = `${fmtKm(km)} km away`;

    btn.textContent = 'SEE RESULTS →';
  } else {
    btn.textContent = 'NEXT CITY →';
  }
}

// ── Round flow ───────────────────────────────────────────────────────────────
function pickCity() {
  let pool = CITIES.filter(c => c.difficulty === difficulty);
  if (regionFilter !== 'All') pool = pool.filter(c => c.region === regionFilter);
  if (!pool.length) {
    pool = CITIES.filter(c => regionFilter === 'All' || c.region === regionFilter);
  }
  if (!pool.length) pool = CITIES;
  // Avoid immediate repeat of the same city when possible.
  let next = pool[Math.floor(Math.random() * pool.length)];
  if (current && pool.length > 1) {
    let guard = 0;
    while (next.name === current.name && guard++ < 8) next = pool[Math.floor(Math.random() * pool.length)];
  }
  return next;
}

function startRound() {
  clearMarkers();
  resetZoom();
  round++;
  current = mode === 'challenge' ? challenge.cities[round - 1] : pickCity();
  gameState = 'guessing';
  renderPrompt();
  updateStatsBar();
  showHint();
}

function placeGuess(svgX, svgY) {
  if (gameState !== 'guessing' || !current) return;
  const { lat, lon } = svgToLatLon(svgX, svgY);
  const km = haversineKm(lat, lon, current.lat, current.lon);
  const score = calcScore(km);
  gameState = 'revealed';
  hideHint();
  drawResult(svgX, svgY);
  showResult(km, score);
  recordRound(km, score);
}

function recordRound(km, score) {
  sessionDistTotal += km;
  sessionScoreTotal += score;
  if (km < sessionBest.km) sessionBest = { km, city: current.name };
  updateStatsBar();

  // Persistent stats (both modes count toward personal history).
  const s = loadStats();
  s.totalRounds += 1;
  s.totalScore += score;
  s.totalDistanceKm += km;
  if (km < s.bestGuessKm) { s.bestGuessKm = km; s.bestGuessCity = current.name; }
  s.history.push({ city: current.name, guessKm: Math.round(km), score, ts: Date.now() });
  if (s.history.length > 50) s.history = s.history.slice(-50);
  saveStats(s);

  if (mode === 'challenge') {
    challengeRounds.push({ city: current.name, km, score });
  } else {
    recentKm.push(km);
    if (recentKm.length > 20) recentKm = recentKm.slice(-20);
    evaluateDifficulty();
  }
}

function onNext() {
  if (mode === 'challenge') {
    if (round >= challenge.rounds) { finishChallenge(); return; }
    startRound();
    return;
  }
  if (round % 10 === 0) { showSummary(); return; }
  startRound();
}

// ── Solo session summary (every 10 rounds) ──────────────────────────────────
function showSummary() {
  gameState = 'summary';
  const avg = Math.round(sessionDistTotal / round);
  const total = sessionScoreTotal;
  const best = sessionBest;
  const diffLabel = DIFF_META[difficulty].label;
  const diffEmoji = DIFF_META[difficulty].badge.slice(0, 2);

  // Persist best session average.
  const st = loadStats();
  if (avg < st.bestSessionAvgKm) { st.bestSessionAvgKm = avg; saveStats(st); }

  const copyText =
`🌍 GeoRush — ${round} rounds
${diffEmoji} ${diffLabel} difficulty
🎯 Best: ${fmtKm(best.km)} km (${best.city})
📍 Avg: ${fmtKm(avg)} km away
🏆 ${total.toLocaleString('en-US')} / ${(round * 1000).toLocaleString('en-US')}
▶ Play: ${PLAY_URL}`;

  openModal(`
    <h2>🌍 GeoRush — ${round} Rounds</h2>
    <hr class="gr-divider">
    <div class="gr-summary-row">${diffEmoji} Difficulty reached: <b>${diffLabel}</b></div>
    <div class="gr-summary-row">🎯 Best guess: <b>${escapeHtml(best.city)}</b> — ${fmtKm(best.km)} km</div>
    <div class="gr-summary-row">📍 Avg distance: <b>${fmtKm(avg)} km</b></div>
    <div class="gr-summary-row">🏆 Score: <b>${total.toLocaleString('en-US')} / ${(round * 1000).toLocaleString('en-US')}</b></div>
    <hr class="gr-divider">

    <button class="gr-btn secondary" id="summaryContinueBtn">Keep Playing →</button>
  `);
  $('copyScoreBtn').addEventListener('click', () => copyToClipboard(copyText, $('copyScoreBtn'), '📋 Copy Score'));
  $('summaryContinueBtn').addEventListener('click', () => { closeModal(); startRound(); });
}

function onRegionChange(e) {

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function copyToClipboard(text, btn, restore) {
  const done = () => { if (btn) { btn.textContent = '✅ Copied!'; setTimeout(() => { btn.textContent = restore; }, 1600); } };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else { fallbackCopy(text, done); }
}
function fallbackCopy(text, done) {
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta); done();
  } catch {}
}

function buildChallengeCities(region, rounds) {
  let pool = CITIES.filter(c => region === 'All' || c.region === region);
  if (pool.length < rounds) pool = CITIES.slice();
  // Shuffle and take `rounds`.
  const shuffled = pool.slice();
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  return shuffled.slice(0, rounds);
}

    <h2>✅ Challenge created!</h2>
    <p class="sub">Share this link — anyone who opens it plays the same ${rounds} cities.</p>
    <div class="gr-link-box"><code id="ccLink">${escapeHtml(url)}</code></div>
    <button class="gr-btn" id="ccCopy">📋 Copy Link</button>
    <button class="gr-btn secondary" id="ccClose">Done</button>
  `);
  $('ccCopy').addEventListener('click', () => copyToClipboard(url, $('ccCopy'), '📋 Copy Link'));
  $('ccClose').addEventListener('click', () => {
    closeModal();
    if (mode === 'solo') { if (gameState === 'challenge_create') startRound(); }
  });
}

// ── Loading & playing a challenge ────────────────────────────────────────────
async function initChallenge() {
  showMapStatus('Loading challenge…');
  const rows = await sbGet(`challenges?id=eq.${encodeURIComponent(challengeId)}&select=*`);
  if (!rows || !rows.length) {
    hideMapStatus();
    openModal(`
      <h2>Challenge not found</h2>
      <p class="sub">This challenge link is invalid or could not be loaded.</p>
      <button class="gr-btn" id="goSolo">Play Solo Instead →</button>
    `);
    $('goSolo').addEventListener('click', () => { window.location.href = PLAY_URL; });
    return;
  }
  challenge = rows[0];
  // Normalize cities (jsonb → array of city objects).
  if (typeof challenge.cities === 'string') {
    try { challenge.cities = JSON.parse(challenge.cities); } catch { challenge.cities = []; }
  }
  if (!Array.isArray(challenge.cities) || !challenge.cities.length) {
    challenge.cities = buildChallengeCities(challenge.region || 'All', challenge.rounds || 10);
  }
  if (!challenge.rounds) challenge.rounds = challenge.cities.length;
  hideMapStatus();
  promptChallengeName();
}

function promptChallengeName() {
  openModal(`
    <h2>🏆 GeoRush Challenge</h2>
    <p class="sub">${challenge.rounds} ${challenge.region && challenge.region !== 'All' ? escapeHtml(challenge.region) + ' ' : ''}cities${challenge.created_by ? ' • by ' + escapeHtml(challenge.created_by) : ''}. Enter your name to play.</p>
    <div class="gr-field">
      <label for="cpName">Your name</label>
      <input class="gr-input" id="cpName" maxlength="20" placeholder="e.g. Sarah" />
    </div>
    <div id="cpError" class="gr-err" hidden></div>
    <button class="gr-btn" id="cpStart">Start Challenge →</button>
  `);
  const start = () => {
    const v = $('cpName').value.trim();
    if (!v) { $('cpError').textContent = 'Please enter your name.'; $('cpError').hidden = false; return; }
    challengePlayer = v;
    closeModal();
    startRound();
  };
  $('cpStart').addEventListener('click', start);
  $('cpName').addEventListener('keydown', e => { if (e.key === 'Enter') start(); });
}

async function finishChallenge() {
  gameState = 'challenge_complete';
  const n = challengeRounds.length || 1;
  const avg = Math.round(challengeRounds.reduce((a, r) => a + r.km, 0) / n);
  const total = challengeRounds.reduce((a, r) => a + r.score, 0);
  let best = { km: Infinity, city: '' };
  challengeRounds.forEach(r => { if (r.km < best.km) best = { km: r.km, city: r.city }; });

  showLeaderboardLoading();
  await sbPost('scores', {
    challenge_id: challenge.id,
    player_name: challengePlayer,
    avg_distance_km: avg,
    total_score: total,
    best_guess_city: best.city,
    best_guess_km: Math.round(best.km),
    rounds_played: n,
  });
  await renderLeaderboard({ avg, total, best });
}

function showLeaderboardLoading() {
  openModal(`
    <h2>🏆 GeoRush Challenge</h2>
    <p class="sub">Submitting your score…</p>
    <p class="gr-muted">Loading leaderboard…</p>
  `);
}

async function renderLeaderboard(mine) {
  const rows = await sbGet(`scores?challenge_id=eq.${encodeURIComponent(challenge.id)}&order=total_score.desc&select=*`);
  const regionLabel = challenge.region && challenge.region !== 'All' ? `${challenge.region} ` : '';
  let body;
  if (!rows) {
    body = `<p class="gr-err">⚠️ Could not load the leaderboard (network issue).</p>`;
  } else {
    let myIndex = -1;
    rows.forEach((r, i) => {
      if (myIndex === -1 && r.player_name === challengePlayer &&
          r.total_score === mine.total && r.avg_distance_km === mine.avg) myIndex = i;
    });
    const trs = rows.map((r, i) => {
      const v = verdict(r.avg_distance_km);
      const rank = i < 3 ? RANK_MEDALS[i] : (i + 1) + '.';
      return `<tr class="${i === myIndex ? 'me' : ''}">
        <td class="rank">${rank}</td>
        <td class="name">${escapeHtml(r.player_name || '—')}</td>
        <td class="num">${v.emoji} ${fmtKm(r.avg_distance_km)} km</td>
        <td class="num">${Number(r.total_score).toLocaleString('en-US')} pts</td>
      </tr>`;
    }).join('');
    body = `<table class="gr-lb">${trs || `<tr><td class="gr-muted">No scores yet.</td></tr>`}</table>`;
  }

  openModal(`
    <h2>🏆 GeoRush Challenge</h2>
    <p class="sub">${challenge.rounds} ${escapeHtml(regionLabel)}Cities</p>
    ${body}
    <hr class="gr-divider">
    <button class="gr-btn" id="lbShare">📋 Share My Score</button>
    <button class="gr-btn secondary" id="lbNew">Create New Challenge</button>
  `);
  const shareText =
`🌍 GeoRush Challenge — ${challenge.rounds} cities
🎯 ${challengePlayer}
📍 Avg: ${fmtKm(mine.avg)} km away
🏆 ${mine.total.toLocaleString('en-US')} pts
▶ Play: ${PLAY_URL}?c=${challenge.id}`;
  $('lbShare').addEventListener('click', () => copyToClipboard(shareText, $('lbShare'), '📋 Share My Score'));
  $('lbNew').addEventListener('click', showChallengeCreate);
}
// ─────────────────────────────────────────────────────────────────────────────
// Init
// ─────────────────────────────────────────────────────────────────────────────
function startSolo() {
  difficulty = 'easy';
  round = 0;
  current = null;
  gameState = 'idle';
  startRound();
}

function boot() {
  $('nextBtn').addEventListener('click', onNext);
  $('settingsBtn').addEventListener('click', openSettings);
  $('regionFilter').addEventListener('change', onRegionChange);

  if (mode === 'challenge') {
    // Challenge cities are fixed; no region filter or difficulty scaling.
    $('regionFilter').style.display = 'none';
    $('settingsBtn').style.display = 'none';
  }

  (function whenTopo() {
    if (window.__worldTopology) {
      initMap(window.__worldTopology);
      if (mode === 'challenge') initChallenge();
      else startSolo();
    } else {
      requestAnimationFrame(whenTopo);
    }
  })();
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>
</body>
</html>
